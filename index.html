<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Will You Get Birria With Me?</title>
    <style>
        @keyframes sparkle {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.1);
            }
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('background%20.png?v=1') no-repeat center center fixed;
            background-size: cover;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: auto;
        }

        .card {
            background-color: transparent;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: none;
        }

        .cat-gif {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #d1496c;
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-shadow: 0 8px 16px rgba(173, 216, 230, 1), 
                         0 4px 8px rgba(173, 216, 230, 0.9), 
                         2px 2px 4px rgba(255, 255, 255, 0.7);
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: bold;
            position: relative;
        }

        #yesBtn {
            background-color: #ff6b8b;
            color: white;
            flex: 0 0 auto;
        }

        #yesBtn:hover {
            background-color: #ff5878;
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #f0f0f0;
            color: #666;
            flex: 0 0 auto;
        }

        #noBtn:hover {
            background-color: #e0e0e0;
        }

        .custom-cursor {
            position: fixed;
            width: 40px;
            height: 40px;
            pointer-events: none;
            display: none;
            z-index: 9999;
            animation: sparkle 0.6s ease-in-out infinite;
            font-size: 40px;
            line-height: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

    <audio id="backgroundMusic" loop>
        <source src="https://catbox.moe" type="audio/mpeg">
    </audio>

    <div class="custom-cursor" id="customCursor">🤘</div>

    <div class="card">
        <img class="cat-gif" src="cat.gif" alt="Cute cat">
        <h1>🌸 Will you get birria with me? 🌸</h1>
        <div class="btn-container">
            <button id="yesBtn" onclick="alert('Yay! Can\'t wait! 🥰')">🤘 Fuck Yes! 🤘</button>
            <button id="noBtn">NO</button>
        </div>
    </div>

    <script>
        const customCursor = document.getElementById('customCursor');
        const noBtn = document.getElementById('noBtn');
        const backgroundMusic = document.getElementById('backgroundMusic');
        let isNoBtnHovered = false;
        let cursorIsFlower = false;
        let audioStarted = false;

        // Play audio on first user interaction
        function playAudio() {
            if (audioStarted) return;
            audioStarted = true;
            backgroundMusic.volume = 1.0;
            backgroundMusic.play().catch(error => {
                console.log('Audio playback error:', error);
                audioStarted = false; 
            });

            // Remove listeners after first successful execution
            document.removeEventListener('click', playAudio);
            document.removeEventListener('mousemove', playAudio);
            document.removeEventListener('touchstart', playAudio);
            document.removeEventListener('keypress', playAudio);
        }

        // Add listeners to trigger audio on movement or clicks
        document.addEventListener('click', playAudio);
        document.addEventListener('mousemove', playAudio);
        document.addEventListener('touchstart', playAudio);
        document.addEventListener('keypress', playAudio);

        // Track mouse movement
        document.addEventListener('mousemove', (e) => {
            // Position custom cursor
            customCursor.style.left = (e.clientX - 20) + 'px';
            customCursor.style.top = (e.clientY - 20) + 'px';
            customCursor.style.display = 'block';

            // If hovering over NO button, jump cursor away
            if (isNoBtnHovered) {
                const randomX = Math.random() * (window.innerWidth - 40);
                const randomY = Math.random() * (window.innerHeight - 40);
                customCursor.style.left = randomX + 'px';
                customCursor.style.top = randomY + 'px';
                customCursor.style.transform = 'scale(1.3)';
                setTimeout(() => {
                    customCursor.style.transform = 'scale(1)';
                }, 100);
            }
        });

        // Detect when cursor enters the NO button area
        noBtn.addEventListener('mouseenter', () => {
            isNoBtnHovered = true;
        });

        noBtn.addEventListener('mouseleave', () => {
            isNoBtnHovered = false;
        });

        // Toggle cursor icon on click
        document.addEventListener('click', (e) => {
            if (e.target !== noBtn) {
                cursorIsFlower = !cursorIsFlower;
                customCursor.textContent = cursorIsFlower ? '🌸' : '🤘';
            }
        });

        // Hide cursor when leaving window
        document.addEventListener('mouseleave', () => {
            customCursor.style.display = 'none';
        });

        document.addEventListener('mouseenter', () => {
            customCursor.style.display = 'block';
        });
    </script>
</body>
</html>
