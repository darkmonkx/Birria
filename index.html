<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Will You Get Birria With Me?</title>
  <style>
    /* Base styles to make the custom cursor and card function correctly */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffeef2;
      font-family: sans-serif;
      overflow: hidden;
      cursor: none; /* Hides default cursor so custom one shines */
    }
    .custom-cursor {
      position: fixed;
      font-size: 24px;
      pointer-events: none;
      z-index: 9999;
      display: none;
      transition: transform 0.1s ease;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .cat-gif {
      max-width: 100%;
      border-radius: 10px;
    }
    .btn-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 50px;
      cursor: none;
      font-weight: bold;
      transition: transform 0.1s;
    }
    #yesBtn {
      background-color: #ff4d6d;
      color: white;
    }
    #noBtn {
      background-color: #ccc;
      color: #333;
    }
    /* Overlay style placeholder for the startEverything function */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.9);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.4s, visibility 0.4s;
    }
    .start-btn {
      padding: 20px 40px;
      font-size: 20px;
      background: #ff4d6d;
      color: white;
      border-radius: 10px;
    }
  </style>
</head>
<body>

<!-- Audio element with your specified Catbox audio link -->
<audio id="backgroundMusic" src="https://catbox.moe" loop></audio>

<!-- Optional Overlay: click it to trigger music immediately if browser blocks autoplay -->
<div id="overlay" onclick="startEverything()">
  <button class="start-btn">Click to Start 🌸</button>
</div>

<div class="custom-cursor" id="customCursor">🤘</div> 
<div class="card"> 
  <img class="cat-gif" src="cat.gif" alt="Cute cat"> 
  <h1>🌸 Will you get birria with me? 🌸</h1> 
  <div class="btn-container"> 
    <button id="yesBtn" onclick="alert('Yay! Can\'t wait! 🥰')">🤘 Fuck Yes! 🤘</button> 
    <button id="noBtn">NO</button> 
  </div> 
</div> 

<script> 
const customCursor = document.getElementById('customCursor'); 
const noBtn = document.getElementById('noBtn'); 
const backgroundMusic = document.getElementById('backgroundMusic'); 
const overlay = document.getElementById('overlay'); 
let isNoBtnHovered = false; 
let cursorIsFlower = false; 

// Unconditionally sets full volume and plays the track
function playAudioUninterrupted() {
  backgroundMusic.volume = 1.0; 
  backgroundMusic.play().catch(error => {
    console.log("Playback prevented until user interacts with page.");
  });
}

// Fades out the overlay and starts the track 
function startEverything() { 
  playAudioUninterrupted(); 
  if (overlay) {
    overlay.style.opacity = '0'; 
    overlay.style.visibility = 'hidden'; 
    setTimeout(() => { 
      overlay.style.display = 'none'; 
    }, 400); 
  }
} 

// Listen to ANY user interaction to play the audio
['mousemove', 'click', 'keydown', 'scroll', 'touchstart'].forEach(eventType => {
  document.addEventListener(eventType, playAudioUninterrupted);
});

// Track mouse movement 
document.addEventListener('mousemove', (e) => { 
  customCursor.style.left = (e.clientX - 20) + 'px'; 
  customCursor.style.top = (e.clientY - 20) + 'px'; 
  customCursor.style.display = 'block'; 
  if (isNoBtnHovered) { 
    const randomX = Math.random() * (window.innerWidth - 40); 
    const randomY = Math.random() * (window.innerHeight - 40); 
    customCursor.style.left = randomX + 'px'; 
    customCursor.style.top = randomY + 'px'; 
    customCursor.style.transform = 'scale(1.3)'; 
    setTimeout(() => { 
      customCursor.style.transform = 'scale(1)'; 
    }, 100); 
  } 
}); 

noBtn.addEventListener('mouseenter', () => { 
  isNoBtnHovered = true; 
}); 

noBtn.addEventListener('mouseleave', () => { 
  isNoBtnHovered = false; 
}); 

document.addEventListener('click', (e) => { 
  if (e.target !== noBtn && (!overlay || !overlay.contains(e.target))) { 
    cursorIsFlower = !cursorIsFlower; 
    customCursor.textContent = cursorIsFlower ? '🌸' : '🤘'; 
  } 
}); 

document.addEventListener('mouseleave', () => { 
  customCursor.style.display = 'none'; 
}); 

document.addEventListener('mouseenter', () => { 
  customCursor.style.display = 'block'; 
}); 
</script> 
</body> 
</html>
